name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: diamond + lattice + diverge
        run: node --experimental-strip-types --test engine/*.test.ts

  seals:
    name: no deleted live seals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid G1 / train_ok / feeds_omega as live seals
        run: bash scripts/pr-seal-check.sh

  occupant:
    name: occupant bleed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: one occupant per named skill
        run: bash scripts/occupant-bleed-check.sh

  cli-spawn:
    name: CLI spawn-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PROXY docs to engine lock strings
        run: bash scripts/cli-spawn-lock-check.sh

  telos-hold:
    name: telos-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: telos identity after two diverges
        run: bash scripts/telos-hold-check.sh

  collate-steelman:
    name: collate vs steelman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: steelman only after exclusive leftover
        run: bash scripts/collate-steelman-gate.sh

  lcd-look:
    name: LCD look-elsewhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: empty meet redirects, does not convert
        run: bash scripts/lcd-look-elsewhere-check.sh

  monitor-dual:
    name: monitor dual cap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SI+LCD only; overload refuse
        run: bash scripts/monitor-dual-cap-check.sh

  diamond-mutex:
    name: diamond mutex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLI diamond matches engine mutex
        run: bash scripts/diamond-mutex-check.sh

  async-equator:
    name: async equator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: per-path pendingProjection
        run: bash scripts/async-equator-check.sh

  finish-board:
    name: FINISH_BOARD refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Morph landed; next S10
        run: bash scripts/finish-board-refresh-check.sh

  s10-s12-align:
    name: S10–S12 command align
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fork-sens clone-experiment clone-paces spawn lock
        run: bash scripts/s10-s12-command-align-check.sh

  s13-s15-pointers:
    name: S13–S15 pointers + README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lattice twin README occupant
        run: bash scripts/s13-s15-pointers-readme-check.sh

  ci-push:
    name: push to main runs engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: workflow on.push includes main
        run: bash scripts/ci-push-engine-check.sh

  hardnote-type:
    name: HardNote no as-never
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: required evidence without type lie
        run: bash scripts/hardnote-type-check.sh
