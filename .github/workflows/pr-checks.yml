name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: diamond + lattice + diverge
        run: node --experimental-strip-types --test engine/*.test.ts

  seals:
    name: no deleted live seals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid G1 / train_ok / feeds_omega as live seals
        run: bash scripts/pr-seal-check.sh

  occupant:
    name: occupant bleed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: one occupant per named skill
        run: bash scripts/occupant-bleed-check.sh
